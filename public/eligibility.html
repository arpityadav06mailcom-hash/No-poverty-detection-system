<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eligibility | NPDS</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="brand"><span class="logo">NP</span><div><b>NPDS</b><small>Eligibility Assessment</small></div></div><nav><a href="index.html">Home</a><a href="register.html">Register</a><a href="track.html">Track</a><a href="schemes.html">Schemes</a></nav></header><section class="section"><div class="title"><span class="eyebrow">ASSESSMENT</span><h2>Illustrative Eligibility Checker</h2><p>This is an academic demonstration and not an official government eligibility test.</p></div><div class="elig"><div class="form"><label class="field">Monthly Income ₹<input id="income" type="number"></label><br><label class="field">Family Size<input id="family" type="number" value="4"></label><br><label class="field">Region<select id="region"><option>Rural</option><option>Urban</option></select></label><br><button class="btn primary" onclick="calc()">Calculate Score</button></div><div class="score"><div class="circle"><b id="score">--</b></div><h3 id="text">Enter details</h3><p class="muted">Illustrative score only.</p></div></div></section><script>function calc(){let i=+income.value,f=+family.value,r=region.value,s=100;if(i>30000)s-=45;else if(i>20000)s-=30;else if(i>12000)s-=15;if(r==="Rural")s+=5;else s-=5;if(f>=6)s+=8;else if(f>=4)s+=4;s=Math.max(0,Math.min(100,s));score.textContent=s;text.textContent=s>=60?"Potentially Eligible":"Needs Review"}</script></body></html>
