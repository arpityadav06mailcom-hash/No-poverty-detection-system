<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schemes | NPDS</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="brand"><span class="logo">NP</span><div><b>NPDS</b><small>Central & State Schemes</small></div></div><nav><a href="index.html">Home</a><a href="register.html">Register</a><a href="track.html">Track</a><a href="admin-login.html">Admin</a></nav></header><section class="section"><div class="title"><span class="eyebrow">WELFARE SCHEMES</span><h2>Central & State-level Schemes</h2><p>Scheme records can be updated by the administrator.</p></div><div class="tools"><input id="search" placeholder="Search schemes..." oninput="render()"><select id="level" onchange="render()"><option value="">All levels</option><option>Central</option><option>State</option></select></div><div id="grid" class="schemegrid"></div></section><footer><b>NPDS</b><span>Always check the official scheme portal for current rules.</span></footer><script src="js/common.js"></script><script>let data=[];async function load(){data=await api("/api/schemes");render()}function render(){const q=search.value.toLowerCase(),l=level.value;grid.innerHTML=data.filter(s=>(!l||s.level===l)&&((s.name+s.description+s.eligibility).toLowerCase().includes(q))).map(s=>`<article class="scheme"><span class="badge">${esc(s.level)}${s.state?" • "+esc(s.state):""}</span><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><p><b>Eligibility:</b> ${esc(s.eligibility)}</p><p><b>Benefits:</b> ${esc(s.benefits)}</p>${s.link?`<a class="btn secondary" target="_blank" rel="noopener" href="${esc(s.link)}">Official Portal</a>`:""}</article>`).join("")||"<p>No schemes found.</p>"}load()</script></body></html>
