<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track | NPDS</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="brand"><span class="logo">NP</span><div><b>NPDS</b><small>Application Tracking</small></div></div><nav><a href="index.html">Home</a><a href="register.html">Register</a><a href="schemes.html">Schemes</a><a href="admin-login.html">Admin</a></nav></header><section class="section"><div class="title"><span class="eyebrow">TRACKING</span><h2>Track your application</h2><p>Enter the NPDS application ID.</p></div><div class="track"><input id="id" placeholder="NPDS-2026-ABC123"><button class="btn primary" onclick="track()">Track</button></div><div id="result" class="result"></div></section><footer><b>NPDS</b><span>Application status tracking</span></footer><script src="js/common.js"></script><script>
async function track(){const idv=id.value.trim();try{const a=await api("/api/applications/"+encodeURIComponent(idv));result.style.display="block";result.innerHTML="<h3>"+esc(a.fullName)+"</h3><p><b>ID:</b> "+esc(a.applicationId)+"</p><p><b>Status:</b> <span class='badge'>"+esc(a.status)+"</span></p><p><b>PAN Status:</b> "+esc(a.panStatus)+"</p><p><b>Documents:</b> "+esc(a.documentStatus)+"</p><p><b>Eligibility:</b> "+esc(a.eligibility)+" ("+a.eligibilityScore+"/100)</p>"}catch(e){result.style.display="block";result.innerHTML="<b style='color:#c92a2a'>"+esc(e.message)+"</b>"}}const q=new URLSearchParams(location.search).get("id");if(q){id.value=q;track()}</script></body></html>
