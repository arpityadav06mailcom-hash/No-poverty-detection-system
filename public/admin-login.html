<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | NPDS</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="brand"><span class="logo">NP</span><div><b>NPDS</b><small>Administrator Portal</small></div></div><nav><a href="index.html">Home</a><a href="schemes.html">Schemes</a></nav></header><section class="section"><div class="adminbox form"><div class="title"><span class="eyebrow">ADMIN</span><h2>Administrator Login</h2><p>Demo credentials are provided in README.md.</p></div><label class="field">Username<input id="username"></label><br><label class="field">Password<input id="password" type="password"></label><br><button class="btn primary" onclick="login()">Login</button><div id="msg" class="msg"></div></div></section><script src="js/common.js"></script><script>async function login(){try{await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});location.href="admin-dashboard.html"}catch(e){msg.className="msg error";msg.textContent=e.message}}</script></body></html>
